# One-click deploy on Render's free tier (Blueprint). Secrets marked sync:false are asked for in the Render form.
services:
  - type: web
    name: cadral-ai-ops-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: WARM_MODELS
        value: "0"
      - key: EMBEDDINGS
        value: hash
      - key: RERANKER
        value: lexical
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
