name: sync-from-drive
on:
  workflow_dispatch:
    inputs:
      drive_id:
        description: Google Drive file id of a zip to unpack over the repo
        required: true
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download zip and commit
        run: |
          curl -sSL -o /tmp/p.zip "https://drive.google.com/uc?export=download&id=${{ inputs.drive_id }}"
          unzip -oq /tmp/p.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync project files"
          git push
