name: import-from-drive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download project zip and commit it
        run: |
          curl -sSL -o /tmp/p.zip "https://drive.google.com/uc?export=download&id=1JjWdzAV5Tt8XWoZgCY2E9WaEMCfZ_RKn"
          file /tmp/p.zip
          unzip -oq /tmp/p.zip -d .
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full project source"
          git push
